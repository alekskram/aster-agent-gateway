[project]
name = "aster-agent-gateway"
version = "0.1.0"
description = "MCP gateway for AI agents to Aster DEX public data: futures and spot market overviews, order books, klines, funding and TradFi-perp screeners, vault deposit flows, public account views. Read-only, keyless."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["aster", "asterdex", "perps", "mcp", "ai-agents", "defi", "funding"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastmcp>=3.0",
]

[project.urls]
Homepage = "https://github.com/alekskram/aster-agent-gateway"
Repository = "https://github.com/alekskram/aster-agent-gateway"
Issues = "https://github.com/alekskram/aster-agent-gateway/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pip-audit", "hatchling"]

[project.scripts]
aster-agent-gateway = "aster_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aster_mcp"]

[tool.pytest.ini_options]
markers = ["online: live API integration (run with -m online)"]
addopts = "-m 'not online'"
